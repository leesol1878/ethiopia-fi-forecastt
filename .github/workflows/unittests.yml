name: Python CI - Ethiopia FI Forecast

on:
  push:
    branches: [  main, task-1, task-3, task-4, task-5, week-12-improvements]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov black flake8 isort
        pip install pandas numpy matplotlib seaborn plotly streamlit statsmodels scikit-learn shap
    
    - name: Check formatting with black
      run: |
        black --check src/ tests/ || echo "Black formatting needed"
    
    - name: Lint with flake8
      run: |
        flake8 src/ tests/ --count --max-line-length=127 --statistics || echo "Linting issues found"
    
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false